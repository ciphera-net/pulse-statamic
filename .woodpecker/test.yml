# Runs on pull_request AND on push to main.
#
# A workflow that only runs on pull requests checks the proposal and never the
# branch that ships, so this one runs on both.
#
# What this covers: both PHPUnit suites. Unit tests TagBuilder on its own.
# Feature boots a headless Statamic app through Orchestra Testbench and renders
# {{ pulse:tracker }} through Antlers, so it checks the markup a template gets
# and that the settings blueprint rejects a mistyped domain.
#
# What this does NOT cover: a full Statamic site built with Composer (addon
# auto-discovery from a path repository, the settings page writing its YAML
# file, the Control Panel carrying nothing). scripts/verify.sh runs that before
# a release.
#
# composer.lock is not committed (this is an addon), so the install resolves the
# newest releases the version constraints allow. A red run on an unchanged
# branch therefore means a dependency moved, or Composer now refuses a release
# that has a published security advisory.
when:
  - event: pull_request
  - event: push
    branch: main

labels:
  runner: k8s

steps:
  - name: test
    image: registry.ops.ciphera.net/mirror/docker.io/library/composer:2.11.1@sha256:07cb23c4c9d528524a8b9a67c403d6ad7fef2268651eb1448e3874d40f28b789
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 768Mi, cpu: 250m }
          limits: { memory: 2Gi }
    commands:
      - php --version
      - composer --version
      - composer install --no-interaction --no-progress --prefer-dist
      # The count is asserted rather than trusted. It is a floor, not an
      # equality: adding tests must never redden the build.
      - |
        vendor/bin/phpunit --colors=never --log-junit /tmp/phpunit-junit.xml
        COUNT=$(php -r '$x = simplexml_load_file("/tmp/phpunit-junit.xml"); echo (int) $x->testsuite["tests"];')
        echo "phpunit collected $COUNT test(s)"
        [ "$COUNT" -ge 25 ] || { echo "REFUSING: expected at least 25 tests, collected $COUNT. The suite shrank or stopped being collected."; exit 1; }
